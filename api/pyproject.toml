[project]
name = "api"
version = "0.1.0"
description = "MiniStore FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 95
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "RUF"]
# B008: FastAPI's Depends()/Query() defaults are the idiomatic DI pattern.
# UP046: PEP 695 generics are not stable with pydantic v2 generics yet.
ignore = ["B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations and the data-table seed exceed the line budget.
"alembic/versions/*" = ["E501", "W291"]
"app/seed.py" = ["E501"]

