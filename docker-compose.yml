services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ministore
      POSTGRES_USER: ministore
      POSTGRES_PASSWORD: ministore
    ports:
      - "5432:5432"
    volumes:
      - ministore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ministore -d ministore"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      APP_NAME: MiniStore API
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://ministore:ministore@db:5432/ministore
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ministore_pgdata:
